<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Universal Live Slot Monitor v2</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #090a0f; --surface: #131520; --surface-card: #1a1d2c; --border: #23273a;
            --text: #ffffff; --text-muted: #94a3b8; --green: #10b981; --green-glow: rgba(16, 185, 129, 0.12);
            --red: #f43f5e; --red-glow: rgba(244, 63, 94, 0.12); --accent: #3b82f6;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-font-smoothing: antialiased; }
        body { background: var(--bg); color: var(--text); padding-bottom: 60px; font-size: 14px; }
        header { background: rgba(9, 10, 15, 0.8); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); padding: 0 24px; height: 72px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
        .btn { background: var(--surface-card); color: var(--text); border: 1px solid var(--border); padding: 12px 22px; border-radius: 12px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s ease; display: inline-flex; align-items: center; gap: 8px; }
        .btn-main { background: var(--text); color: var(--bg); border: 1px solid var(--text); }
        .btn-main.running { background: var(--red); color: var(--text); border-color: var(--red); box-shadow: 0 4px 12px var(--red-glow); }
        main { max-width: 1040px; margin: 0 auto; padding: 24px 20px; display: flex; flex-direction: column; gap: 24px; }
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 24px; }
        .card-title { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); margin-bottom: 16px; }
        .form-grid { display: flex; flex-direction: column; gap: 16px; }
        .input-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        @media (max-width: 700px) { .input-row { grid-template-columns: 1fr; } }
        .input-wrapper label { display: block; font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 8px; }
        .input-wrapper input { width: 100%; padding: 14px 16px; background: var(--surface-card); border: 1px solid var(--border); border-radius: 12px; color: var(--text); font-size: 14px; }
        .matrix-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; }
        .time-pad { background: var(--surface-card); border: 1px solid var(--border); border-radius: 12px; padding: 16px 8px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-weight: 600; text-align: center; }
        .time-pad.available { background: var(--green-glow); border-color: var(--green); color: var(--green); }
        .activity-container { background: var(--surface-card); border: 1px solid var(--border); border-radius: 12px; height: 180px; overflow-y: auto; padding: 16px; font-size: 12px; display: flex; flex-direction: column; gap: 6px; }
        .activity-row { display: flex; gap: 10px; }
        .activity-time { color: var(--text-muted); flex-shrink: 0; }
        .activity-row.success { color: var(--green); }
        .activity-row.error { color: var(--red); }
        .toggle-container { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-muted); margin-top: 8px; }
    </style>
</head>
<body>

    <header>
        <div style="display:flex; align-items:center; gap:10px;">
            <span style="font-size:20px;">🎯</span>
            <span style="font-weight:700; font-size:16px;">Radar Target Universale v2</span>
            <span id="liveTag" style="font-size:11px; background:var(--border); color:var(--text-muted); padding:3px 8px; border-radius:20px;">Standby</span>
        </div>
        <button class="btn btn-main" id="actionBtn" onclick="toggleSystem()">▶ Avvia Monitoraggio</button>
    </header>

    <main>
        <div class="card">
            <div class="card-title">1. Configurazione Endpoint / API</div>
            <div class="form-grid">
                <div class="input-wrapper">
                    <label>Link Completo dell'API da monitorare (URL)</label>
                    <input type="text" id="apiTargetUrl" placeholder="Incolla qui l'URL rintracciato con F12">
                </div>
                
                <div class="input-row">
                    <div class="input-wrapper">
                        <label>Frequenza Controllo (Secondi)</label>
                        <input type="number" id="loopSeconds" value="12" min="5">
                    </div>
                    <div class="input-wrapper">
                        <label>Canale Notifiche Smartphone (ntfy.sh)</label>
                        <input type="text" id="ntfyChannel" placeholder="Es: mio_canale_radar_push">
                    </div>
                </div>

                <div class="toggle-container">
                    <input type="checkbox" id="useProxy" checked>
                    <label for="useProxy">Usa Proxy Avanzato (AllOrigins Bypass)</label>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-title">2. Risultati Scansione Live</div>
            <div class="matrix-grid" id="matrixGrid">
                <div style="grid-column:1/-1; text-align:center; color:var(--text-muted); padding:20px;">
                    Inserisci l'URL dell'API in alto e clicca su "Avvia Monitoraggio".
                </div>
            </div>
        </div>

        <div class="card">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
                <div class="card-title" style="margin-bottom:0;">Registro Attività di Rete</div>
                <div id="lastCheckTime" style="font-size:12px; color:var(--text-muted);">Ultimo check: mai</div>
            </div>
            <div class="activity-container" id="activityBox"></div>
        </div>
    </main>

    <script>
        let isRunning = false;
        let engineInterval = null;
        let historyNotified = new Set();

        if(localStorage.getItem('saved_api_url')) {
            document.getElementById('apiTargetUrl').value = localStorage.getItem('saved_api_url');
            document.getElementById('ntfyChannel').value = localStorage.getItem('saved_ntfy_channel');
            document.getElementById('loopSeconds').value = localStorage.getItem('saved_loop_seconds') || 12;
        }

        function toggleSystem() {
            const btn = document.getElementById("actionBtn");
            const tag = document.getElementById("liveTag");
            const targetUrl = document.getElementById("apiTargetUrl").value.trim();
            const secondi = parseInt(document.getElementById("loopSeconds").value) || 12;

            if(!targetUrl && !isRunning) {
                alert("Inserisci prima un link API valido!");
                return;
            }

            if(isRunning) {
                isRunning = false;
                clearInterval(engineInterval);
                btn.textContent = "▶ Avvia Monitoraggio";
                btn.className = "btn btn-main";
                tag.textContent = "Standby";
                tag.style.background = "var(--border)"; tag.style.color = "var(--text-muted)";
                pushLog("Engine arrestato.");
            } else {
                isRunning = true;
                historyNotified.clear();
                
                localStorage.setItem('saved_api_url', targetUrl);
                localStorage.setItem('saved_ntfy_channel', document.getElementById("ntfyChannel").value.trim());
                localStorage.setItem('saved_loop_seconds', secondi);

                btn.textContent = "⏹ Ferma Engine";
                btn.className = "btn btn-main running";
                tag.textContent = "LIVE ACTIVE";
                tag.style.background = "var(--green-glow)"; tag.style.color = "var(--green)";
                
                pushLog("Engine Corretto Avviato. Connessione in corso...");
                executeUniversalCheck();
                engineInterval = setInterval(executeUniversalCheck, secondi * 1000);
            }
        }

        async function executeUniversalCheck() {
            let targetUrl = document.getElementById("apiTargetUrl").value.trim();
            const ntfy = document.getElementById("ntfyChannel").value.trim();
            const useProxy = document.getElementById("useProxy").checked;
            const grid = document.getElementById("matrixGrid");
            const timeField = document.getElementById("lastCheckTime");

            const timestamp = new Date().toLocaleTimeString("it-IT");
            timeField.textContent = `Ultimo check: ${timestamp}`;

            let finalUrl = targetUrl;
            if(useProxy) {
                // Cambiato con AllOrigins proxy, molto più tollerante e trasparente
                finalUrl = "https://api.allorigins.win/get?url=" + encodeURIComponent(targetUrl);
            }

            try {
                const response = await fetch(finalUrl);
                if (!response.ok) throw new Error("Risposta server non valida");
                
                let resData = await response.json();
                
                // AllOrigins impacchetta la risposta dentro una proprietà chiamata "contents"
                let data = useProxy ? JSON.parse(resData.contents) : resData;
                
                grid.innerHTML = "";
                let slotsFound = [];

                function searchJsonDeep(obj) {
                    if (!obj || typeof obj !== 'object') return;

                    if (obj.time && (obj.available === true || obj.free === true || obj.status === 'available')) {
                        slotsFound.push({ time: obj.time, label: 'LIBERO' });
                        return;
                    }

                    for (let key in obj) {
                        if (typeof obj[key] === 'string' && (obj[key].toLowerCase() === 'available' || obj[key].toLowerCase() === 'free')) {
                            if(key.includes(":") || !isNaN(key)) {
                                slotsFound.push({ time: key, label: 'LIBERO' });
                            }
                        } else if (typeof obj[key] === 'object') {
                            searchJsonDeep(obj[key]);
                        }
                    }
                }

                searchJsonDeep(data);

                if(slotsFound.length > 0) {
                    slotsFound.sort((a,b) => a.time.localeCompare(b.time));
                    slotsFound.forEach(slot => {
                        const pad = document.createElement("div");
                        pad.className = "time-pad available";
                        pad.innerHTML = `<span>${slot.time}</span><span style="font-size:10px; font-weight:700;">${slot.label}</span>`;
                        grid.appendChild(pad);

                        if(ntfy && !historyNotified.has(slot.time)) {
                            historyNotified.add(slot.time);
                            sendPush(ntfy, `Slot Libero Rilevato! Orario: ${slot.time}.`);
                        }
                    });
                    pushLog(`Connessione riuscita. Rilevati ${slotsFound.length} slot disponibili!`, "success");
                } else {
                    grid.innerHTML = `<div style="grid-column:1/-1; text-align:center; color:var(--red); padding:20px; font-weight:600;">❌ Tutto esaurito su questa risorsa. Continuo a monitorare...</div>`;
                    pushLog("Dati ricevuti: nessun posto libero al momento.");
                }

            } catch (error) {
                pushLog("Errore di formato o blocco di rete. Controlla il link inserito.", "error");
            }
        }

        async function sendPush(channel, msg) {
            try {
                await fetch(`https://ntfy.sh/${channel}`, { method: 'POST', body: msg });
                pushLog(`[NOTIFICA] Avviso inviato su ntfy.sh/${channel}`, "success");
            } catch(e) {}
        }

        function pushLog(text, type = "") {
            const box = document.getElementById("activityBox");
            const time = new Date().toLocaleTimeString("it-IT");
            const row = document.createElement("div");
            row.className = `activity-row ${type}`;
            row.innerHTML = `<span class="activity-time">[${time}]</span> <span>${text}</span>`;
            box.insertBefore(row, box.firstChild);
        }
    </script>
</body>
</html>
